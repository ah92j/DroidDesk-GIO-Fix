              missing.append('keep Firefox RDD enabled and expose the system FFmpeg decoder')
          if ' --install-recommends ' in desktop_experience_script or '--no-install-recommends install -y firefox-esr' not in desktop_experience_script or 'install -y --reinstall firefox-esr' in desktop_experience_script or 'libavcodec-extra$codec_abi' not in desktop_experience_script or 'media.rdd-ffmpeg.enabled' not in desktop_experience_script or 'MOZ_DISABLE_RDD_SANDBOX=1' not in desktop_experience_script:
              missing.append('install Firefox and matching ARM64 FFmpeg codec ABI without forced reinstall or optional recommendations')
          if 'kali-wallpapers-all' in desktop_experience_script or 'kali-wallpapers-2026' not in desktop_experience_script:
              missing.append('avoid the multi-gigabyte kali-wallpapers-all metapackage')
          if 'pulse_ready=0' not in desktop_experience_script or 'list short sinks' not in desktop_experience_script:
              missing.append('verify Firefox audio bridge reaches Android AudioTrack sink')
          if 'Still working:' not in desktop_experience_script or 'policy-rc.d' not in desktop_experience_script:
              missing.append('add PRoot service-start protection and dpkg heartbeats')
          if 'file -b "$file"' not in desktop_experience_script or 'Download the ARM64 AppImage' not in desktop_experience_script:
              missing.append('validate AppImage architecture before creating launcher')
          if 'dpkg-deb -f "$file" Architecture' not in desktop_experience_script or '--fix-broken install' not in desktop_experience_script or 'package-install.log' not in desktop_experience_script:
              missing.append('validate local DEB architecture and recover/report dependency failures')
          if 'Firefox.desktop' not in desktop_experience_script or 'droiddesk-firefox' not in desktop_experience_script:
              missing.append('install a dedicated Firefox desktop launcher with PulseAudio environment')
          if 'rm -f /home/kali/Desktop/Trash.desktop' not in desktop_experience_script:
              missing.append('remove the duplicate custom Trash desktop shortcut')
          live_xfce_refresh = runtime.split('private fun applyKaliDesktopSettingsToRunningSession', 1)[1].split('/** Start Kali XFCE', 1)[0]
          if 'last-image --set' in live_xfce_refresh or 'background-style --set' in live_xfce_refresh:
              missing.append('never overwrite the selected wallpaper or dock style during desktop refresh')
          if 'name="image-path"' not in desktop_experience_script:
              missing.append('expose Kali wallpaper directory in XFCE Desktop Settings')
          if 'PRESERVE_ARCHIVE' not in desktop_experience_script or 'restore_user_xfce_preferences' not in desktop_experience_script:
              missing.append('snapshot and restore user XFCE settings on app upgrade')
          if '.config/xfce4/desktop' not in desktop_experience_script or '.config/xfce4/panel' not in desktop_experience_script:
              missing.append('preserve desktop icon positions and dock/panel layout')
          if 'libavcodec-extra$codec_abi' not in desktop_experience_script or 'libavcodec$codec_abi' not in desktop_experience_script:
              missing.append('support both ARM64 FFmpeg codec package names')
          if 'user_pref("media.rdd-process.enabled", true);' not in desktop_experience_script:
              missing.append('apply Firefox PRoot software-decoder fallback')
          if 'Open Add applications > Browse or Featured' not in desktop_experience_script:
              missing.append('guide users away from incompatible AMD64 downloads')

          if 'android.permission.QUERY_ALL_PACKAGES' in manifest:
              missing.append('remove unnecessary QUERY_ALL_PACKAGES permission')

          if missing:
              raise SystemExit(
                  'Missing expected committed source changes: ' + '; '.join(missing)
              )

          print('Android AudioTrack pipe, PulseAudio sink routing, GIO, chroot mounts, distro status, updater security, permissions, XFCE and version checks passed.')
          PY

      - name: Validate Kali APT setup script syntax and configuration
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="app/android/app/src/main/assets/droiddesk/kali/setup-kali-default.sh"
          bash -n "$SCRIPT"
          bash "$SCRIPT" --self-test
          ! grep -Fq 'KALI_CDN' "$SCRIPT"
          ! grep -Fq 'KALI_REDIRECTOR' "$SCRIPT"
          ! grep -Fq 'http://' "$SCRIPT"
          ! grep -Fq 'stty' "$SCRIPT"
          test "$(grep -Fc 'run_apt_transaction() {' "$SCRIPT")" -eq 1
          test "$(grep -Fc 'Package installation and verification completed.' "$SCRIPT")" -eq 1

          EXPERIENCE="app/android/app/src/main/assets/droiddesk/kali/desktop-experience.sh"
          bash -n "$EXPERIENCE"
          bash "$EXPERIENCE" --self-test

      - name: Validate non-interactive Kali installer shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/LinuxRuntime.kt'
          ).read_text()
          start = source.index('fun installKaliProotDesktop(')
          end = source.index('private fun configureKaliDns(', start)
          method = source[start:end]
          assert '"/bin/bash", "-lc"' not in method
          assert method.count('"/bin/bash", "-c"') == 3
          print('Kali setup uses non-login, non-interactive Bash for preflight, APT and verification.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install Android CMake and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "cmake;3.22.1" "build-tools;35.0.0"
          FLUTTER_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          printf 'flutter.sdk=%s\n' "$FLUTTER_SDK" > app/android/local.properties

      - name: Configure permanent release signing
        shell: bash
        env:
          DROIDDESK_KEYSTORE_BASE64: ${{ secrets.DROIDDESK_KEYSTORE_BASE64 }}
          DROIDDESK_KEYSTORE_PASSWORD: ${{ secrets.DROIDDESK_KEYSTORE_PASSWORD }}
          DROIDDESK_KEY_ALIAS: ${{ secrets.DROIDDESK_KEY_ALIAS }}
          DROIDDESK_KEY_PASSWORD: ${{ secrets.DROIDDESK_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${DROIDDESK_KEYSTORE_BASE64:?Missing DROIDDESK_KEYSTORE_BASE64 secret}"
          : "${DROIDDESK_KEYSTORE_PASSWORD:?Missing DROIDDESK_KEYSTORE_PASSWORD secret}"
          : "${DROIDDESK_KEY_ALIAS:?Missing DROIDDESK_KEY_ALIAS secret}"
          : "${DROIDDESK_KEY_PASSWORD:?Missing DROIDDESK_KEY_PASSWORD secret}"

          KEYSTORE_PATH="$RUNNER_TEMP/droiddesk-release.jks"

          printf '%s' "$DROIDDESK_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$DROIDDESK_KEYSTORE_PASSWORD" \
            -alias "$DROIDDESK_KEY_ALIAS" >/dev/null

          echo "DROIDDESK_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Permanent release keystore loaded and alias validated."

      - name: Generate Gradle wrapper
        working-directory: app/android
        env:
          DROIDDESK_KEYSTORE_PASSWORD: ${{ secrets.DROIDDESK_KEYSTORE_PASSWORD }}
          DROIDDESK_KEY_ALIAS: ${{ secrets.DROIDDESK_KEY_ALIAS }}
          DROIDDESK_KEY_PASSWORD: ${{ secrets.DROIDDESK_KEY_PASSWORD }}
        run: gradle wrapper --gradle-version 8.14 --distribution-type bin --no-validate-url

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Run rootfs archive path safety tests
        working-directory: app/android
        shell: bash
        env:
          DROIDDESK_KEYSTORE_PASSWORD: ${{ secrets.DROIDDESK_KEYSTORE_PASSWORD }}
          DROIDDESK_KEY_ALIAS: ${{ secrets.DROIDDESK_KEY_ALIAS }}
          DROIDDESK_KEY_PASSWORD: ${{ secrets.DROIDDESK_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build ARM64 release APK
        working-directory: app
        shell: bash
        env:
          DROIDDESK_KEYSTORE_PASSWORD: ${{ secrets.DROIDDESK_KEYSTORE_PASSWORD }}
          DROIDDESK_KEY_ALIAS: ${{ secrets.DROIDDESK_KEY_ALIAS }}
          DROIDDESK_KEY_PASSWORD: ${{ secrets.DROIDDESK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Verify permanent APK signing certificate
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/app/outputs/flutter-apk/app-release.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path is not configured."
            exit 1
          fi

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "apksigner was not found in Android build-tools."
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"

          ACTUAL_SHA256="$(sed -n 's/.*certificate SHA-256 digest: *//p' "$RUNNER_TEMP/apk-signature.txt" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"

          EXPECTED_SHA256="e8ba3273fa8e3ca05db4f13b2c58b9c539808c84c71721a293c6dbad4fe80656"

          if [ -z "$ACTUAL_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: APK signing certificate mismatch."
            echo "Expected: $EXPECTED_SHA256"
            echo "Actual:   ${ACTUAL_SHA256:-not found}"
            exit 1
          fi

          echo "APK certificate matches the permanent DroidDesk release key."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kali-Linux-1.4.29-arm64
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

