          for package in ['gvfs', 'gvfs-daemons', 'gvfs-backends', 'kali-wallpapers-2026', 'firefox-esr', 'libpulse0', 'pulseaudio-utils', 'libasound2-plugins', 'ffmpeg', 'gstreamer1.0-libav']:
              if package not in desktop_experience_script:
