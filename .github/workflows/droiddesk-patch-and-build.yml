          if 'background-style" type="uint" value="1"' not in desktop_experience_script:
              missing.append('set the dock panel to transparent RGBA style')
          if 'desktop-experience-v11' not in desktop_experience_script or 'desktop-experience-v11' not in runtime:
              missing.append('use the same v8 desktop migration marker in the script and runtime')
          if 'google-chrome-stable_current_arm64.deb' not in desktop_experience_script:
              missing.append('install the official Google Chrome ARM64 fallback')
          if 'droiddesk-browser.desktop' not in desktop_experience_script or 'droiddesk-browser' not in profile:
              missing.append('install the direct browser helper')
          if 'GIO_USE_VFS=gvfs' not in runtime:
              missing.append('enable GVFS for Trash')
          user_prefs_block = desktop_experience_script.split("done <<'FIREFOX_USER_PREFS'", 1)[1].split("FIREFOX_USER_PREFS", 1)[0]
          if '\npref(' in user_prefs_block:
              missing.append('remove invalid pref() call from Firefox user.js')
          if 'file' not in desktop_experience_script.split('REQUIRED_PACKAGES=(', 1)[1].split(')', 1)[0]:
