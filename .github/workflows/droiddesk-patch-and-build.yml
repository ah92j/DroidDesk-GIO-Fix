          if 'MiscShowThumbnails=NEVER' not in desktop_experience_script:
              missing.append('disable expensive Thunar thumbnails for mobile performance')
          if 'name="use_compositing"' not in desktop_experience_script or '! grep -q' not in desktop_experience_script:
