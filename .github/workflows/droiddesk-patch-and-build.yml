name: DroidDesk Permanent Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - security/hardening-phase-1
    paths:
      - '.github/workflows/droiddesk-patch-and-build.yml'
      - 'app/android/app/build.gradle.kts'
      - 'app/android/app/src/main/AndroidManifest.xml'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/MainActivity.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/RootShell.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/ChrootRuntime.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/AppUpdater.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/LinuxRuntime.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/KaliProotCommandLine.kt'
      - 'app/android/app/src/test/kotlin/com/orailnoor/droiddesk/runtime/KaliProotCommandLineTest.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/RootfsManager.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/RootfsArchiveSanitizer.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/ArchivePathValidator.kt'
      - 'app/android/app/src/main/assets/droiddesk/kali/setup-kali-default.sh'
      - 'app/android/app/src/test/kotlin/com/orailnoor/droiddesk/runtime/ArchivePathValidatorTest.kt'
      - 'app/android/app/src/test/kotlin/com/orailnoor/droiddesk/runtime/RootfsArchiveSanitizerTest.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/view/DesktopActivity.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/MainActivity.kt'
      - 'app/lib/services/platform_bridge.dart'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/AndroidPcmAudioOutput.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/XfceMobileProfile.kt'
      - 'app/lib/state/app_state.dart'
      - 'app/lib/screens/setup/setup_progress.dart'
      - 'app/lib/screens/home_screen.dart'
      - 'app/lib/screens/setup/de_install_screen.dart'
      - 'app/pubspec.yaml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate committed DroidDesk runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/LinuxRuntime.kt'
          ).read_text()
          proot_builder = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/KaliProotCommandLine.kt'
          ).read_text()
          proot_tests = Path(
              'app/android/app/src/test/kotlin/com/orailnoor/droiddesk/runtime/KaliProotCommandLineTest.kt'
          ).read_text()
          rootfs_manager = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/RootfsManager.kt'
          ).read_text()
          archive_sanitizer = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/RootfsArchiveSanitizer.kt'
          ).read_text()
          archive_validator = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/ArchivePathValidator.kt'
          ).read_text()
          kali_setup_script = Path(
              'app/android/app/src/main/assets/droiddesk/kali/setup-kali-default.sh'
          ).read_text()
          gradle_app = Path('app/android/app/build.gradle.kts').read_text()
          audio_output = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/AndroidPcmAudioOutput.kt'
          ).read_text()
          profile = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/XfceMobileProfile.kt'
          ).read_text()
          root_shell = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/RootShell.kt'
          ).read_text()
          chroot = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/ChrootRuntime.kt'
          ).read_text()
          activity = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/MainActivity.kt'
          ).read_text()
          updater = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/AppUpdater.kt'
          ).read_text()
          pubspec = Path('app/pubspec.yaml').read_text()
          manifest = Path('app/android/app/src/main/AndroidManifest.xml').read_text()
          archive_tests = Path(
              'app/android/app/src/test/kotlin/com/orailnoor/droiddesk/runtime/ArchivePathValidatorTest.kt'
          ).read_text()
          sanitizer_tests = Path(
              'app/android/app/src/test/kotlin/com/orailnoor/droiddesk/runtime/RootfsArchiveSanitizerTest.kt'
          ).read_text()

          required_runtime = [
              'env["PULSE_SERVER"] = "tcp:127.0.0.1:4713"',
              'env["PULSE_RUNTIME_PATH"] = File(tmpDir, "pulse").absolutePath',
              'private fun getPulseAudioSinkNames(): List<String>?',
              'private fun getPulseAudioEnvironment(pulseDir: File)',
              'private fun isPulseAudioReady(requiredSink: String? = null): Boolean',
              'private fun setPulseAudioDefaultSink(sinkName: String): Boolean',
              'private fun startPulseAudio(): Boolean',
              'private fun stopPulseAudio()',
              'module-pipe-sink file=',
              'AndroidPcmAudioOutput.start(audioPipe)',
              'AndroidPcmAudioOutput.SINK_NAME',
              'port=4713',
              '# Audio is started and supervised by LinuxRuntime in the Android process.',
              'if (!startPulseAudio())',
          ]

          required_audio_output = [
              'internal object AndroidPcmAudioOutput',
              'const val SINK_NAME = "droiddesk_android"',
              'AudioTrack.Builder()',
              'AudioTrack.WRITE_BLOCKING',
              'Os.mkfifo(',
              'private fun consumePcm(session: Session)',
          ]

          required_profile = [
              '.droiddesk-xfce-mobile-v16',
              'File(homeDir, "Desktop").mkdirs()',
              '<property name="style" type="int" value="2"/>',
          ]

          required_root_shell = [
              'fun execChecked(command: String): String',
              'if (exitCode != 0)',
          ]

          required_chroot = [
              'fun getInstalledDistro(): String = rootfsManager.getInstalledDistro()',
              'private fun isMountPresent(target: String): Boolean',
              'private fun mountIfNeeded(relative: String, mountArgs: String)',
              'val dnsConfig = "nameserver 8.8.8.8',
              'rootShell.execChecked(',
          ]

          required_activity = [
              'val installedDistro = chrootRuntime.getInstalledDistro()',
              'setOf("ubuntu", "kali")',
              '"$installedDistro-chroot"',
          ]

          required_updater = [
              'private const val MAX_UPDATE_BYTES = 512L * 1024L * 1024L',
              'private fun requireHttpsUrl(raw: String): URL',
              'current = requireHttpsUrl(URL(current, location).toString())',
              'val verifiedApk = requireManagedApk(context, apk)',
          ]

          missing = [item for item in required_runtime if item not in runtime]
          missing.extend(item for item in required_audio_output if item not in audio_output)
          missing.extend(item for item in required_profile if item not in profile)
          missing.extend(item for item in required_root_shell if item not in root_shell)
          missing.extend(item for item in required_chroot if item not in chroot)
          missing.extend(item for item in required_activity if item not in activity)
          missing.extend(item for item in required_updater if item not in updater)
          if 'KaliProotCommandLine.build(' not in runtime:
              missing.append('Kali PRoot command builder integration')
          if 'KaliProotCommandLine.build(' not in proot_builder or 'addAll(guestCommand)' not in proot_builder:
              missing.append('Kali PRoot command builder implementation')
          if 'workingDirectory, "--"' in runtime or '-w /home/kali --' in runtime:
              missing.append('unsupported -- delimiter in a Kali PRoot launch path')
          if '@Test' not in proot_tests or 'assertFalse(command.contains("--"))' not in proot_tests:
              missing.append('Kali PRoot argument separator regression test')
          required_archive_manager = [
              'RootfsArchiveSanitizer.sanitize(',
              'stripTopLevelDirectory = if (distro == "kali") "kali-arm64" else null',
              'MAX_EXPANDED_ARCHIVE_BYTES',
              'sanitizedArchive?.let',
          ]
          required_archive_sanitizer = [
              'TarArchiveInputStream(decoded, "UTF-8")',
              'XZInputStream(rawInput)',
              'TarConstants.LF_SYMLINK',
              'ArchivePathValidator.relativeSymlinkTarget(',
              'stripTopLevelDirectory: String? = null',
              'ArchivePathValidator.stripExpectedArchiveRoot(archiveEntryName, expectedRoot)',
              'ArchivePathValidator.validateSymbolicLinkTarget(',
              'sourceEntry.isCharacterDevice',
              'sourceEntry.isFIFO',
              'maxExpandedBytes',
          ]
          required_archive_validator = [
              'fun normalizeEntryName(',
              'fun stripExpectedArchiveRoot(',
              'fun stripExpectedArchiveRootFromHardLink(',
              'fun validateSymbolicLinkTarget(',
              'MAX_COMPONENT_BYTES',
              'MAX_PATH_BYTES',
          ]
          missing.extend(item for item in required_archive_manager if item not in rootfs_manager)
          missing.extend(item for item in required_archive_sanitizer if item not in archive_sanitizer)
          missing.extend(item for item in required_archive_validator if item not in archive_validator)
          if '@Test' not in archive_tests or 'rejectsTraversalThatWouldEscapeTheRoot' not in archive_tests:
              missing.append('archive path validator unit tests')
          if 'rewritesGuestAbsoluteSymlinkAsRelativeLink' not in archive_tests:
              missing.append('absolute guest symlink unit test')
          if 'acceptsSystemdEscapedUnitNamesContainingBackslashes' not in archive_tests:
              missing.append('systemd escaped filename unit test')
          if 'stripsKaliArchiveRootAndRejectsMembersOutsideIt' not in archive_tests:
              missing.append('Kali archive root normalization unit test')
          if 'stripsKaliArchiveFolderAndPreservesSystemdEscapedFilename' not in sanitizer_tests:
              missing.append('Kali root archive sanitizer integration test')
          if 'rejectsKaliArchiveMembersOutsideTheExpectedRoot' not in sanitizer_tests:
              missing.append('Kali archive root isolation integration test')
          if 'rewritesKaliHardlinksAsRelativeSymlinksForAndroidExtraction' not in sanitizer_tests:
              missing.append('Kali hardlink-to-symlink integration test')
          if 'convertsArchiveHardlinkTargetToSafeRelativeSymlinkPath' not in archive_tests:
              missing.append('rootfs hardlink relative-target unit test')
          if 'implementation("org.tukaani:xz:1.12")' not in gradle_app:
              missing.append('org.tukaani:xz:1.12 dependency')
          if 'implementation("org.apache.commons:commons-compress:1.28.0")' not in gradle_app:
              missing.append('Apache Commons Compress 1.28.0 dependency')

          required_kali_runtime = [
              'minimumFreeBytes = 15L * 1024L * 1024L * 1024L',
              'File(rootfs, ".kali_default_tools_installed")',
              'context.assets.open("droiddesk/kali/setup-kali-default.sh")',
              '240, onLog',
          ]
          required_kali_script = [
              'apt-get update',
              'kali-linux-default',
              'xfce4',
              'DEBIAN_FRONTEND=noninteractive',
              "dpkg-query -W -f='${Status}' kali-linux-default",
          ]
          missing.extend(item for item in required_kali_runtime if item not in runtime)
          missing.extend(item for item in required_kali_script if item not in kali_setup_script)
          if 'startForegroundService()' not in activity[activity.find('"installKaliProotDesktop"'):]:
              missing.append('Kali install must start the DroidDesk foreground service')

          if 'version: 1.4.3+18' not in pubspec:
              missing.append('version: 1.4.0+15')

          if 'android.permission.QUERY_ALL_PACKAGES' in manifest:
              missing.append('remove unnecessary QUERY_ALL_PACKAGES permission')

          if missing:
              raise SystemExit(
                  'Missing expected committed source changes: ' + '; '.join(missing)
              )

          print('Android AudioTrack pipe, PulseAudio sink routing, GIO, chroot mounts, distro status, updater security, permissions, XFCE and version checks passed.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install Android CMake and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "cmake;3.22.1" "build-tools;35.0.0"
          FLUTTER_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          printf 'flutter.sdk=%s\n' "$FLUTTER_SDK" > app/android/local.properties

      - name: Configure permanent release signing
        shell: bash
        env:
          DROIDDESK_KEYSTORE_BASE64: ${{ secrets.DROIDDESK_KEYSTORE_BASE64 }}
          DROIDDESK_KEYSTORE_PASSWORD: ${{ secrets.DROIDDESK_KEYSTORE_PASSWORD }}
          DROIDDESK_KEY_ALIAS: ${{ secrets.DROIDDESK_KEY_ALIAS }}
          DROIDDESK_KEY_PASSWORD: ${{ secrets.DROIDDESK_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${DROIDDESK_KEYSTORE_BASE64:?Missing DROIDDESK_KEYSTORE_BASE64 secret}"
          : "${DROIDDESK_KEYSTORE_PASSWORD:?Missing DROIDDESK_KEYSTORE_PASSWORD secret}"
          : "${DROIDDESK_KEY_ALIAS:?Missing DROIDDESK_KEY_ALIAS secret}"
          : "${DROIDDESK_KEY_PASSWORD:?Missing DROIDDESK_KEY_PASSWORD secret}"

          KEYSTORE_PATH="$RUNNER_TEMP/droiddesk-release.jks"

          printf '%s' "$DROIDDESK_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$DROIDDESK_KEYSTORE_PASSWORD" \
            -alias "$DROIDDESK_KEY_ALIAS" >/dev/null

          echo "DROIDDESK_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Permanent release keystore loaded and alias validated."

      - name: Generate Gradle wrapper
        working-directory: app/android
        env:
          DROIDDESK_KEYSTORE_PASSWORD: ${{ secrets.DROIDDESK_KEYSTORE_PASSWORD }}
          DROIDDESK_KEY_ALIAS: ${{ secrets.DROIDDESK_KEY_ALIAS }}
          DROIDDESK_KEY_PASSWORD: ${{ secrets.DROIDDESK_KEY_PASSWORD }}
        run: gradle wrapper --gradle-version 8.14 --distribution-type bin --no-validate-url

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Run rootfs archive path safety tests
        working-directory: app/android
        shell: bash
        env:
          DROIDDESK_KEYSTORE_PASSWORD: ${{ secrets.DROIDDESK_KEYSTORE_PASSWORD }}
          DROIDDESK_KEY_ALIAS: ${{ secrets.DROIDDESK_KEY_ALIAS }}
          DROIDDESK_KEY_PASSWORD: ${{ secrets.DROIDDESK_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build ARM64 release APK
        working-directory: app
        shell: bash
        env:
          DROIDDESK_KEYSTORE_PASSWORD: ${{ secrets.DROIDDESK_KEYSTORE_PASSWORD }}
          DROIDDESK_KEY_ALIAS: ${{ secrets.DROIDDESK_KEY_ALIAS }}
          DROIDDESK_KEY_PASSWORD: ${{ secrets.DROIDDESK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Verify permanent APK signing certificate
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/app/outputs/flutter-apk/app-release.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path is not configured."
            exit 1
          fi

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "apksigner was not found in Android build-tools."
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"

          ACTUAL_SHA256="$(sed -n 's/.*certificate SHA-256 digest: *//p' "$RUNNER_TEMP/apk-signature.txt" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"

          EXPECTED_SHA256="e8ba3273fa8e3ca05db4f13b2c58b9c539808c84c71721a293c6dbad4fe80656"

          if [ -z "$ACTUAL_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: APK signing certificate mismatch."
            echo "Expected: $EXPECTED_SHA256"
            echo "Actual:   ${ACTUAL_SHA256:-not found}"
            exit 1
          fi

          echo "APK certificate matches the permanent DroidDesk release key."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidDesk-1.4.3-arm64
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
