          if 'linuxRuntime.searchKaliPackages(kaliRootfs' not in activity or 'linuxRuntime.installKaliStorePackage(kaliRootfs' not in activity:
              missing.append('route Kali App Store operations to the Kali PRoot environment')
          if 'if (file.isFile) return' not in profile or 'writeConfigIfMissing' not in profile or 'PROFILE_MARKER = ".droiddesk-xfce-mobile-v23"' not in profile:
              missing.append('migrate XFCE profile without replacing user settings or dock launchers')

          if 'clear_stale_apt_indexes' in kali_setup_script:
              missing.append('preserve APT package indexes between resumable installer attempts')
          if 'APT::Keep-Downloaded-Packages=true' not in kali_setup_script:
