name: DroidDesk Permanent Release Build # final verified 1.4.29+46 publish trigger

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - security/hardening-phase-1
    paths:
      - '.github/workflows/droiddesk-patch-and-build.yml'
      - 'app/android/app/build.gradle.kts'
      - 'app/android/app/src/main/AndroidManifest.xml'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/MainActivity.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/RootShell.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/ChrootRuntime.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/AppUpdater.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/LinuxRuntime.kt'
      - 'app/android/app/src/test/kotlin/com/orailnoor/droiddesk/runtime/KaliInstallCoordinatorTest.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/KaliInstallCoordinator.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/KaliProotCommandLine.kt'
      - 'app/android/app/src/test/kotlin/com/orailnoor/droiddesk/runtime/KaliProotCommandLineTest.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/RootfsManager.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/RootfsArchiveSanitizer.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/ArchivePathValidator.kt'
      - 'app/android/app/src/main/assets/droiddesk/kali/setup-kali-default.sh'
      - 'app/android/app/src/main/assets/droiddesk/kali/desktop-experience.sh'
      - 'app/android/app/src/test/kotlin/com/orailnoor/droiddesk/runtime/ArchivePathValidatorTest.kt'
      - 'app/android/app/src/test/kotlin/com/orailnoor/droiddesk/runtime/RootfsArchiveSanitizerTest.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/view/DesktopActivity.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/MainActivity.kt'
      - 'app/lib/services/platform_bridge.dart'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/AndroidPcmAudioOutput.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/XfceMobileProfile.kt'
      - 'app/lib/state/app_state.dart'
      - 'app/lib/screens/apps/app_catalog_screen.dart'
      - 'app/lib/services/update_service.dart'
      - 'app/lib/widgets/update_sheet.dart'
      - 'app/lib/screens/setup/setup_progress.dart'
      - 'app/lib/screens/home_screen.dart'
      - 'app/lib/screens/setup/de_install_screen.dart'
      - 'app/pubspec.yaml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate committed DroidDesk runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/LinuxRuntime.kt'
          ).read_text()
          kali_coordinator = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/KaliInstallCoordinator.kt'
          ).read_text()
          kali_coordinator_tests = Path(
              'app/android/app/src/test/kotlin/com/orailnoor/droiddesk/runtime/KaliInstallCoordinatorTest.kt'
          ).read_text()
          platform_bridge = Path('app/lib/services/platform_bridge.dart').read_text()
          app_state = Path('app/lib/state/app_state.dart').read_text()
          proot_builder = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/KaliProotCommandLine.kt'
          ).read_text()
          proot_tests = Path(
              'app/android/app/src/test/kotlin/com/orailnoor/droiddesk/runtime/KaliProotCommandLineTest.kt'
          ).read_text()
          rootfs_manager = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/RootfsManager.kt'
          ).read_text()
          archive_sanitizer = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/RootfsArchiveSanitizer.kt'
          ).read_text()
          archive_validator = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/ArchivePathValidator.kt'
          ).read_text()
          kali_setup_script = Path(
              'app/android/app/src/main/assets/droiddesk/kali/setup-kali-default.sh'
          ).read_text()
          desktop_experience_script = Path(
              'app/android/app/src/main/assets/droiddesk/kali/desktop-experience.sh'
          ).read_text()
          home_screen = Path('app/lib/screens/home_screen.dart').read_text()
          gradle_app = Path('app/android/app/build.gradle.kts').read_text()
          audio_output = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/AndroidPcmAudioOutput.kt'
          ).read_text()
          profile = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/XfceMobileProfile.kt'
          ).read_text()
          root_shell = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/RootShell.kt'
          ).read_text()
          chroot = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/ChrootRuntime.kt'
          ).read_text()
          activity = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/MainActivity.kt'
          ).read_text()
          desktop_activity = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/view/DesktopActivity.kt'
          ).read_text()
          updater = Path(
              'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/AppUpdater.kt'
          ).read_text()
          pubspec = Path('app/pubspec.yaml').read_text()
          app_state = Path('app/lib/state/app_state.dart').read_text()
          update_service = Path('app/lib/services/update_service.dart').read_text()
          update_sheet = Path('app/lib/widgets/update_sheet.dart').read_text()
          app_catalog = Path('app/lib/screens/apps/app_catalog_screen.dart').read_text()
          manifest = Path('app/android/app/src/main/AndroidManifest.xml').read_text()
          archive_tests = Path(
              'app/android/app/src/test/kotlin/com/orailnoor/droiddesk/runtime/ArchivePathValidatorTest.kt'
          ).read_text()
          sanitizer_tests = Path(
              'app/android/app/src/test/kotlin/com/orailnoor/droiddesk/runtime/RootfsArchiveSanitizerTest.kt'
          ).read_text()

          required_runtime = [
              'fun waitForKaliDesktopReady(rootfs: File, timeoutSeconds: Int = 70): Boolean',
              'fun isKaliDesktopProcessSetReady(rootfs: File): Boolean',
              'private fun stopKaliDesktopProcesses(rootfs: File)',
              'fun getLastKaliDesktopDiagnostic(): String',
              'private fun prepareKaliXfceHomePermissions(rootfs: File)',
              'fun stopSession()',
              'process.waitFor(1_500, TimeUnit.MILLISECONDS)',
              'process.waitFor(2, TimeUnit.SECONDS)',
              'chown -R kali:kali',
              'xdpyinfo',
              'xfce-session.log',
              'private fun ensureKaliGlycinAndroidCompatibility(rootfs: File): Boolean',
              'fun scheduleKaliDesktopExperienceMigration(rootfs: File)',
              'glycin-proot-compat-v1',
              'xfce-support-v1',
              'desktop-experience-v11',
              'private fun repairKaliDesktopSupport(rootfs: File): Boolean',
              'val minimumVersion = "2.2.2+ds-1"',
              'GLYCIN_DISABLE_SANDBOX=i-know-the-risks',
              'PULSE_SINK=droiddesk_android',
              'PULSE_LATENCY_MSEC=80',
              'MOZ_DISABLE_CONTENT_SANDBOX=1',
              'ensureKaliDesktopExperience(rootfs)',
              'gdk-pixbuf-csource --raw --name=droiddesk_png_probe',
              'gdk-pixbuf-csource --raw --name=droiddesk_svg_probe',
              'glycin-thumbnailers',
              'libglycin-2-0',
              'private fun kaliDesktopHealthCheckScript(timeoutSeconds: Int = 0): String',
              'has_live_process()',
              'has_viewable_window()',
              'GIO_USE_VFS=gvfs GIO_USE_VOLUME_MONITOR=unix',
              'dbus-run-session',
              'install -d -m 1777 /tmp/.ICE-unix',
              '_NET_SUPPORTING_WM_CHECK',
              'XFCE_DESKTOP_WINDOW',
              'Map State: IsViewable',
              'XFCE is visually ready',
              'Kali XFCE is not visually ready; clearing any orphaned or incomplete session before restart',
              'for name in xfce4-panel xfdesktop xfwm4 xfce4-session startxfce4 dbus-launch xfsettingsd xfconfd; do',
              'stopKaliDesktopProcesses(rootfs)',
              'File(rootfs, "usr/share/icons/$theme/index.theme").isFile',
              'wallpaperPathInSession = "/home/kali/.local/share/backgrounds/droiddesk-ubuntu-touch.jpg"',
              '"/usr/bin/sudo", "-E", "-u", "kali", "/bin/bash", "-c", sessionScript',
              'env["PULSE_SERVER"] = "tcp:127.0.0.1:4713"',
              'env["PULSE_RUNTIME_PATH"] = File(tmpDir, "pulse").absolutePath',
              'private fun getPulseAudioSinkNames(): List<String>?',
              'private fun getPulseAudioEnvironment(pulseDir: File)',
              'private fun isPulseAudioReady(requiredSink: String? = null): Boolean',
              'private fun setPulseAudioDefaultSink(sinkName: String): Boolean',
              'private fun startPulseAudio(): Boolean',
              'private fun stopPulseAudio()',
              'module-pipe-sink file=',
              'AndroidPcmAudioOutput.start(audioPipe)',
              'AndroidPcmAudioOutput.SINK_NAME',
              'port=4713',
              '# Audio is started and supervised by LinuxRuntime in the Android process.',
              'if (!startPulseAudio())',
          ]

          required_audio_output = [
              'internal object AndroidPcmAudioOutput',
              'const val SINK_NAME = "droiddesk_android"',
              'AudioTrack.Builder()',
              'AudioTrack.WRITE_BLOCKING',
              'Os.mkfifo(',
              'private fun consumePcm(session: Session)',
          ]

          required_profile = [
              '.droiddesk-xfce-mobile-v23',
              'xsettingsConfig(iconThemeName: String)',
              'iconThemeName: String = "Adwaita"',
              'value="$iconThemeName"',
              'File(homeDir, "Desktop").mkdirs()',
              'installFileManagerDefaults(homeDir)',
              'FileManager=Thunar',
              'inode/directory=thunar.desktop;',
              'TryExec=${exec.substringBefore(\' \')}', 
              'droiddesk-browser %U',
              'droiddesk-browser %U',
              'exec = "/usr/bin/thunar %u"',
              '<property name="style" type="int" value="2"/>',
              '<property name="show-home" type="bool" value="true"/>',
              '<property name="show-filesystem" type="bool" value="true"/>',
              '<property name="show-trash" type="bool" value="true"/>',
              '<property name="use_compositing" type="bool" value="true"/>',
              '<property name="show-removable" type="bool" value="true"/>',
          ]

          required_rootfs_size = [
              'ROOTFS_SIZE_CACHE_TTL_MS',
              'refreshRootfsSizeInBackground',
              'rootfs-size-cache',
              'invalidateRootfsSizeCache()',
          ]

          required_root_shell = [
              'fun execChecked(command: String): String',
              'if (exitCode != 0)',
          ]

          required_chroot = [
              'fun getInstalledDistro(): String = rootfsManager.getInstalledDistro()',
              'private fun isMountPresent(target: String): Boolean',
              'private fun mountIfNeeded(relative: String, mountArgs: String)',
              'val dnsConfig = "nameserver 8.8.8.8',
              'rootShell.execChecked(',
          ]

          required_activity = [
              'val installedDistro = chrootRuntime.getInstalledDistro()',
              'setOf("ubuntu", "kali")',
              '"$installedDistro-chroot"',
              'thread(name = "runtime-status")',
              'thread(name = "device-info")',
              'thread(name = "start-linux-dispatch")',
              'thread(name = "return-to-desktop")',
              'private fun resolveDesktopLaunchConfig()',
              'private fun launchDesktopScreen(config: DesktopLaunchConfig, startSession: Boolean)',
              'desktopLaunchInProgress',
              'Flutter AppState is the single owner of the auto-start preference.',
              'thread(name = "notification-open-desktop")',
          ]

          required_desktop_activity = [
              'kaliHealthCheckInProgress',
              'KaliDesktopHealthCheck',
              'linuxRuntime.waitForKaliDesktopReady(rootfs, timeoutSeconds = timeoutSeconds)',
              'linuxRuntime.isKaliDesktopProcessSetReady(File(filesDir, "rootfs"))',
              'startKaliDesktopWithRecovery()',
              'val startupTimeouts = intArrayOf(45, 35)',
              'getLastKaliDesktopDiagnostic()',
              'restartDesktopSession()',
          ]

          if 'maybeAutoStartDesktop' in activity:
              missing.append('use a single Flutter-owned auto-start path')
          if 'if (homeIntent.action != ACTION_OPEN_DESKTOP) return' not in activity:
              missing.append('native HOME launch must not create a competing desktop activity')
          if 'if (failure == null)' not in activity or 'result.error("stop_linux"' not in activity:
              missing.append('Stop Server must always complete its MethodChannel result')

          required_updater = [
              'private const val MAX_UPDATE_BYTES = 512L * 1024L * 1024L',
              'private fun requireHttpsUrl(raw: String): URL',
              'current = requireHttpsUrl(URL(current, location).toString())',
              'val verifiedApk = requireManagedApk(context, apk)',
          ]

          missing = [item for item in required_runtime if item not in runtime]
          missing.extend(item for item in required_audio_output if item not in audio_output)
          missing.extend(item for item in required_profile if item not in profile)
          if 'WebBrowser=google-chrome.desktop' in profile:
              missing.append('do not hardcode Chrome as default in the XFCE profile')
          if 'WebBrowser=droiddesk-browser.desktop' not in profile:
              missing.append('write a real default browser helper entry')
          missing.extend(item for item in required_root_shell if item not in root_shell)
          missing.extend(item for item in required_rootfs_size if item not in rootfs_manager)
          missing.extend(item for item in required_chroot if item not in chroot)
          missing.extend(item for item in required_activity if item not in activity)
          missing.extend(item for item in required_desktop_activity if item not in desktop_activity)
          missing.extend(item for item in required_updater if item not in updater)
          if 'pgrep -u kali' in runtime or 'pkill -TERM -u kali' in runtime or 'pkill -KILL -u kali' in runtime:
              missing.append('do not filter PRoot process checks by guest UID')
          if 'KaliInstallCoordinator.tryStart()' not in runtime or 'KaliInstallCoordinator.finish(succeeded)' not in runtime:
              missing.append('Kali install single-operation guard')
          shell_name_token = chr(36) + "{'$'}name"
          escaped_shell_name = 'pkill -TERM -x "' + shell_name_token + '"'
          escaped_shell_name_kill = 'pkill -KILL -x "' + shell_name_token + '"'
          if escaped_shell_name not in runtime or escaped_shell_name_kill not in runtime:
              missing.append('Kotlin-safe escaping for shell variables in XFCE cleanup commands')
          if 'pkill -TERM -x "$name"' in runtime or 'pkill -KILL -x "$name"' in runtime:
              missing.append('no unescaped shell variables inside Kotlin raw strings')
          if 'fun snapshot()' not in kali_coordinator or 'private var running = false' not in kali_coordinator:
              missing.append('Kali install process state')
          if 'getKaliInstallStatus' not in platform_bridge or "'getKaliInstallStatus'" not in platform_bridge:
              missing.append('Flutter bridge for Kali install state')
          if 'DroidDeskPlatform.getKaliInstallStatus()' not in app_state or "runtimeStatus['distro'] == 'kali-proot'" not in app_state:
              missing.append('Flutter resume/complete detection for Kali setup')
          if '@Test' not in kali_coordinator_tests or 'preventsASecondInstallWhileTheFirstOneIsRunning' not in kali_coordinator_tests:
              missing.append('Kali concurrent install prevention unit test')
          if 'KaliProotCommandLine.build(' not in runtime:
              missing.append('Kali PRoot command builder integration')
          if 'fun build(' not in proot_builder or 'addAll(guestCommand)' not in proot_builder:
              missing.append('Kali PRoot command builder implementation')
          if 'workingDirectory, "--"' in runtime or '-w /home/kali --' in runtime:
              missing.append('unsupported -- delimiter in a Kali PRoot launch path')
          if '@Test' not in proot_tests or 'assertFalse(command.contains("--"))' not in proot_tests:
              missing.append('Kali PRoot argument separator regression test')
          required_archive_manager = [
              'RootfsArchiveSanitizer.sanitize(',
              'stripTopLevelDirectory = if (distro == "kali") "kali-arm64" else null',
              'MAX_EXPANDED_ARCHIVE_BYTES',
              'sanitizedArchive?.let',
          ]
          required_archive_sanitizer = [
              'TarArchiveInputStream(decoded, "UTF-8")',
              'XZInputStream(rawInput)',
              'TarConstants.LF_SYMLINK',
              'ArchivePathValidator.relativeSymlinkTarget(',
              'stripTopLevelDirectory: String? = null',
              'ArchivePathValidator.stripExpectedArchiveRoot(archiveEntryName, expectedRoot)',
              'ArchivePathValidator.validateSymbolicLinkTarget(',
              'sourceEntry.isCharacterDevice',
              'sourceEntry.isFIFO',
              'maxExpandedBytes',
          ]
          required_archive_validator = [
              'fun normalizeEntryName(',
              'fun stripExpectedArchiveRoot(',
              'fun stripExpectedArchiveRootFromHardLink(',
              'fun validateSymbolicLinkTarget(',
              'MAX_COMPONENT_BYTES',
              'MAX_PATH_BYTES',
          ]
          missing.extend(item for item in required_archive_manager if item not in rootfs_manager)
          missing.extend(item for item in required_archive_sanitizer if item not in archive_sanitizer)
          missing.extend(item for item in required_archive_validator if item not in archive_validator)
          if '@Test' not in archive_tests or 'rejectsTraversalThatWouldEscapeTheRoot' not in archive_tests:
              missing.append('archive path validator unit tests')
          if 'rewritesGuestAbsoluteSymlinkAsRelativeLink' not in archive_tests:
              missing.append('absolute guest symlink unit test')
          if 'acceptsSystemdEscapedUnitNamesContainingBackslashes' not in archive_tests:
              missing.append('systemd escaped filename unit test')
          if 'stripsKaliArchiveRootAndRejectsMembersOutsideIt' not in archive_tests:
              missing.append('Kali archive root normalization unit test')
          if 'stripsKaliArchiveFolderAndPreservesSystemdEscapedFilename' not in sanitizer_tests:
              missing.append('Kali root archive sanitizer integration test')
          if 'rejectsKaliArchiveMembersOutsideTheExpectedRoot' not in sanitizer_tests:
              missing.append('Kali archive root isolation integration test')
          if 'rewritesKaliHardlinksAsRelativeSymlinksForAndroidExtraction' not in sanitizer_tests:
              missing.append('Kali hardlink-to-symlink integration test')
          if 'convertsArchiveHardlinkTargetToSafeRelativeSymlinkPath' not in archive_tests:
              missing.append('rootfs hardlink relative-target unit test')
          if 'implementation("org.tukaani:xz:1.12")' not in gradle_app:
              missing.append('org.tukaani:xz:1.12 dependency')
          if 'implementation("org.apache.commons:commons-compress:1.28.0")' not in gradle_app:
              missing.append('Apache Commons Compress 1.28.0 dependency')

          required_kali_runtime = [
              'minimumFreeBytes = 15L * 1024L * 1024L * 1024L',
              'File(rootfs, ".kali_default_tools_installed")',
              'context.assets.open("droiddesk/kali/setup-kali-default.sh")',
              '240, onLog',
          ]
          required_kali_script = [
              'apt-get "${APT_OPTIONS[@]}" update',
              'kali-linux-default',
              'xfce4',
              'DEBIAN_FRONTEND=noninteractive',
              "dpkg-query -W -f='${Status}' kali-linux-default",
              'https://kali.download/kali/',
              'https://archive.kali.org/kali/',
              'bubblewrap',
              'dbus-daemon',
              'shared-mime-info',
              'libgdk-pixbuf2.0-bin',
              'hicolor-icon-theme',
              'librsvg2-common',
              'glycin-loaders',
              'libglycin-2-0',
              'glycin-thumbnailers',
              'Acquire::ForceIPv4=true',
              'Acquire::https::Verify-Peer=true',
              'Acquire::https::Verify-Host=true',
              'Acquire::Retries=3',
              'BASH_ENV=/dev/null',
              'APT::Keep-Downloaded-Packages=true',
              'run_with_package_heartbeat',
              'policy-rc.d',
              'recover_optional_stalled_theme',
              'adwaita-icon-theme',
              'thunar',
              'exo-utils',
              'procps',
              "dpkg-query -W -f='${Status}' thunar",
              'test -x /usr/bin/thunar',
              'test -x /usr/bin/exo-open',
              'URIs: $repository_uri',
              '/var/cache/apt/archives/partial',
              '/var/lib/apt/lists/partial',
              'dpkg --configure -a',
              '--fix-broken install',
              'apt-sources-original',
              '--self-test',
          ]
          missing.extend(item for item in required_kali_runtime if item not in runtime)
          missing.extend(item for item in required_kali_script if item not in kali_setup_script)

          if 'KALI_CDN' in kali_setup_script or 'KALI_REDIRECTOR' in kali_setup_script:
              missing.append('no stale Kali repository variable references')
          if 'http://' in kali_setup_script:
              missing.append('HTTPS-only Kali APT source configuration')
          if 'stty' in kali_setup_script:
              missing.append('no terminal ioctl calls in non-interactive APT script')
          if kali_setup_script.count('run_apt_transaction() {') != 1:
              missing.append('exactly one Kali APT transaction implementation')
          if kali_setup_script.count('Package installation and verification completed.') != 1:
              missing.append('exactly one clean Kali setup script body')

          kali_install_start = runtime.find('fun installKaliProotDesktop(')
          kali_install_end = runtime.find('private fun configureKaliDns(', kali_install_start)
          kali_install_method = runtime[kali_install_start:kali_install_end]
          if '"/bin/bash", "-lc"' in kali_install_method:
              missing.append('Kali install commands must not load interactive login startup files')
          if kali_install_method.count('"/bin/bash", "-c"') != 3:
              missing.append('all three Kali install/check commands use non-login bash -c')
          if 'startForegroundService()' not in activity[activity.find('"installKaliProotDesktop"'):]:
              missing.append('Kali install must start the DroidDesk foreground service')
          if 'linuxRuntime.waitForKaliDesktopReady(rootfs, timeoutSeconds = timeoutSeconds)' not in desktop_activity:
              missing.append('Kali desktop readiness must be checked inside the Kali PRoot rootfs after session recovery')
          if 'sessionMode == "proot-kali" -> 65' not in desktop_activity:
              missing.append('Kali desktop readiness timeout estimate')

          if 'version: 1.4.29+46' not in pubspec:
              missing.append('expected release version 1.4.29+46')
          if 'private val kaliAptTransactionLock = ReentrantLock(true)' not in runtime or 'kaliAptTransactionLock.withLock' not in runtime:
              missing.append('serialize Kali App Store APT operations against desktop migrations')
          if 'private fun refreshKaliPackageIndexes(' not in runtime or 'apt-get -o Acquire::ForceIPv4=true' not in runtime:
              missing.append('refresh Kali ARM64 package indexes before Browse and Install')
          if 'kali-package-index-updated' not in runtime or 'package-store-install.log' not in runtime:
              missing.append('cache package-index freshness and write readable App Store diagnostics')
          if ' --install-recommends ' in runtime or '--no-install-recommends' not in runtime or '--fix-broken install' not in runtime or 'run_package_heartbeat' not in runtime or 'dpkg --configure -a' not in runtime:
              missing.append('repair interrupted dpkg state before installs and avoid large optional recommendation trees')
          store_command_start = runtime.find('private fun runKaliStoreCommand(')
          store_command_end = runtime.find('private fun refreshKaliPackageIndexes(', store_command_start)
          store_command = runtime[store_command_start:store_command_end]
          if 'onProgress(0.55' in store_command or 'Reading database.*?([0-9]{1,3})%' not in store_command:
              missing.append('report actual APT stages instead of a fixed 55 percent value')
          if 'refreshKaliPackageIndexes(rootfs, force = true, onProgress = onProgress)' not in runtime:
              missing.append('force a fresh ARM64 package index before App Store installs')
          if 'Wrong package architecture.' not in desktop_experience_script or 'Related repository matches' not in desktop_experience_script:
              missing.append('explain AMD64 versus ARM64 and list repository alternatives')
          if "static const repo = 'ah92j/DroidDesk-GIO-Fix';" not in update_service:
