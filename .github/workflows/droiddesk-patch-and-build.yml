on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/droiddesk-patch-and-build.yml'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/LinuxRuntime.kt'
      - 'app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/XfceMobileProfile.kt'
      - 'app/pubspec.yaml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply GIO, audio and desktop defaults
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def insert_once(text: str, anchor: str, addition: str, label: str) -> str:
              if addition.strip() in text:
                  return text
              if text.count(anchor) != 1:
                  raise SystemExit(f"Could not locate unique insertion point: {label}")
              return text.replace(anchor, anchor + addition, 1)

          def insert_before_once(text: str, anchor: str, addition: str, label: str) -> str:
              marker = addition.strip().splitlines()[0].strip()
              if marker in text:
                  return text
              if text.count(anchor) != 1:
                  raise SystemExit(f"Could not locate unique insertion point: {label}")
              return text.replace(anchor, addition + anchor, 1)

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if text.count(old) != 1:
                  raise SystemExit(f"Could not locate unique replacement point: {label}")
              return text.replace(old, new, 1)

          runtime_path = Path('app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/LinuxRuntime.kt')
          runtime = runtime_path.read_text()

          runtime = insert_once(
              runtime,
              '        env["XDG_RUNTIME_DIR"] = tmpDir.absolutePath\n',
              '        // Keep XFCE applications on DroidDesk-local PulseAudio.\n'
              '        env["PULSE_SERVER"] = "tcp:127.0.0.1:4713"\n'
              '        env["PULSE_RUNTIME_PATH"] = File(tmpDir, "pulse").absolutePath\n',
              'PulseAudio environment',
          )

          runtime = insert_once(
              runtime,
              '        env["XDG_DATA_DIRS"] = "${prefixDir.absolutePath}/share"\n',
              '        // Prevent GLib from falling back to the inaccessible original Termux helper path.\n'
              '        env["GIO_LAUNCH_DESKTOP"] =\n'
              '            File(prefixDir, "libexec/gio-launch-desktop").absolutePath\n',
              'GIO helper environment',
          )

          # Start PulseAudio as a Process owned by LinuxRuntime, not as a
          # background shell child of xfce4-session. This keeps audio alive
          # independently of XFCE shell job control and ties shutdown to Stop.
          runtime = insert_once(
              runtime,
              'import java.util.zip.ZipInputStream\n',
              'import java.util.concurrent.TimeUnit\n',
              'PulseAudio wait timeout import',
          )
          runtime = insert_once(
              runtime,
              '        @Volatile private var dbusProcess: Process? = null\n',
              '        @Volatile private var pulseProcess: Process? = null\n',
              'PulseAudio process ownership',
          )

          pulse_helpers = r'''    private fun isPulseAudioReady(): Boolean {
              val pactl = File(binDir, "pactl")
              if (!pactl.canExecute()) return false
              return runCatching {
                  val probe = ProcessBuilder(
                      pactl.absolutePath,
                      "-s", "tcp:127.0.0.1:4713", "info",
                  ).directory(homeDir)
                      .redirectErrorStream(true)
                      .also { builder ->
                          builder.environment().clear()
                          builder.environment().putAll(getTermuxEnv())
                          builder.environment()["PULSE_SERVER"] = "tcp:127.0.0.1:4713"
                          builder.environment()["PULSE_RUNTIME_PATH"] = File(tmpDir, "pulse").absolutePath
                      }
                      .start()
                  if (!probe.waitFor(1200, TimeUnit.MILLISECONDS)) {
                      probe.destroyForcibly()
                      probe.waitFor()
                      false
                  } else {
                      probe.exitValue() == 0
                  }
              }.getOrDefault(false)
          }

          private fun startPulseAudio(): Boolean {
              val pulseDir = File(tmpDir, "pulse").apply { mkdirs() }
              val pulseLog = File(pulseDir, "pulseaudio.log")
              val existing = pulseProcess
              if (existing?.isAlive == true) {
                  val existingDeadline = System.currentTimeMillis() + 5_000
                  while (System.currentTimeMillis() < existingDeadline) {
                      if (isPulseAudioReady()) return true
                      Thread.sleep(250)
                  }
                  Log.w(TAG, "Existing PulseAudio process is alive but the TCP server is not ready")
                  return false
              }
              pulseProcess = null
              if (isPulseAudioReady()) {
                  Log.i(TAG, "Reusing an existing PulseAudio TCP server")
                  return true
              }

              val pulseBinary = File(binDir, "pulseaudio")
              if (!pulseBinary.canExecute()) {
                  Log.e(TAG, "PulseAudio executable is missing: ${pulseBinary.absolutePath}")
                  return false
              }
              File(pulseDir, "native").delete()
              val command = listOf(
                  pulseBinary.absolutePath,
                  "--daemonize=no",
                  "--use-pid-file=no",
                  "--exit-idle-time=-1",
                  "--dl-search-path=${File(prefixDir, "lib/pulseaudio/modules").absolutePath}",
                  "-n",
                  "-L", "module-sles-sink",
                  "-L", "module-native-protocol-tcp auth-ip-acl=127.0.0.1 auth-anonymous=1 port=4713",
                  "-L", "module-native-protocol-unix socket=${File(pulseDir, "native").absolutePath}",
              )

              val started = try {
                  ProcessBuilder(command)
                      .directory(homeDir.apply { mkdirs() })
                      .redirectErrorStream(true)
                      .redirectOutput(ProcessBuilder.Redirect.appendTo(pulseLog))
                      .also { builder ->
                          builder.environment().clear()
                          builder.environment().putAll(getTermuxEnv())
                          builder.environment()["PULSE_SERVER"] = "tcp:127.0.0.1:4713"
                          builder.environment()["PULSE_RUNTIME_PATH"] = pulseDir.absolutePath
                      }
                      .start()
              } catch (error: Exception) {
                  Log.e(TAG, "Failed to launch PulseAudio", error)
                  return false
              }
              pulseProcess = started
              Log.i(TAG, "PulseAudio started as an app-managed process, pid=${processPid(started) ?: -1}")

              val deadline = System.currentTimeMillis() + 10_000
              while (System.currentTimeMillis() < deadline) {
                  if (!started.isAlive) {
                      val exitCode = runCatching { started.exitValue() }.getOrDefault(-1)
                      val tail = runCatching { pulseLog.readLines().takeLast(40).joinToString("\\n") }.getOrDefault("")
                      Log.e(TAG, "PulseAudio exited during startup (code=$exitCode): $tail")
                      pulseProcess = null
                      return false
                  }
                  if (isPulseAudioReady()) {
                      Log.i(TAG, "PulseAudio TCP server ready on 127.0.0.1:4713")
                      return true
                  }
                  Thread.sleep(250)
              }

              Log.w(TAG, "PulseAudio is alive but did not pass the TCP readiness probe; leaving it running. Log: ${pulseLog.absolutePath}")
              return started.isAlive
          }

          private fun stopPulseAudio() {
              val process = pulseProcess
              pulseProcess = null
              if (process?.isAlive == true) {
                  Log.i(TAG, "Stopping app-managed PulseAudio process")
                  process.destroy()
                  if (!process.waitFor(1500, TimeUnit.MILLISECONDS)) process.destroyForcibly()
              }
          }

          '''
          runtime = insert_before_once(
              runtime,
              '    fun stopSession() {\n',
              pulse_helpers,
              'PulseAudio lifecycle helpers',
          )
          runtime = insert_once(
              runtime,
              '            Log.i(TAG, "Session dbus-daemon ready")\n',
              '            if (!startPulseAudio()) {\n'
              '                Log.w(TAG, "PulseAudio did not become ready; inspect ${tmpDir.absolutePath}/pulse/pulseaudio.log")\n'
              '            }\n',
              'Start app-managed PulseAudio after D-Bus',
          )
          runtime = insert_once(
              runtime,
              '        dbusProcess = null\n        Log.i(TAG, "Session stopped")\n',
              '        dbusProcess = null\n        stopPulseAudio()\n        Log.i(TAG, "Session stopped")\n',
              'Stop app-managed PulseAudio with Linux session',
          )

          audio_marker = '            # DROIDDESK_OPENSL_TCP_AUDIO'
          old_audio_marker = '            # PulseAudio daemonizes, so it outlives a stopped session.'
          audio_end_marker = '            echo "DIAG: Launching $desktopCommand natively on DISPLAY=:0 ..."'
          start = runtime.find(audio_marker)
          if start < 0:
              start = runtime.find(old_audio_marker)
          end = runtime.find(audio_end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate the PulseAudio shell block boundaries')

          audio_block = r'''            # Audio is started and supervised by LinuxRuntime in the Android process.
              export PULSE_SERVER="tcp:127.0.0.1:4713"
              export PULSE_RUNTIME_PATH="${tmpDir.absolutePath}/pulse"
              echo "DIAG: Using app-managed OpenSL ES PulseAudio on 127.0.0.1:4713"
              '''
          runtime = runtime[:start] + audio_block + runtime[end:]
          if 'env["GIO_LAUNCH_DESKTOP"]' not in runtime:
              raise SystemExit('GIO_LAUNCH_DESKTOP was not applied')
          if 'module-sles-sink' not in runtime or 'port=4713' not in runtime:
              raise SystemExit('OpenSL ES/TCP audio setup was not applied')
          runtime_path.write_text(runtime)

          profile_path = Path('app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/XfceMobileProfile.kt')
          profile = profile_path.read_text()
          if '    private const val PROFILE_MARKER = ".droiddesk-xfce-mobile-v16"' not in profile:
              if '    private const val PROFILE_MARKER = ".droiddesk-xfce-mobile-v15"' in profile:
                  profile = profile.replace(
                      '    private const val PROFILE_MARKER = ".droiddesk-xfce-mobile-v15"',
                      '    private const val PROFILE_MARKER = ".droiddesk-xfce-mobile-v16"', 1,
                  )
              elif '    private const val PROFILE_MARKER = ".droiddesk-xfce-mobile-v14"' in profile:
                  profile = profile.replace(
                      '    private const val PROFILE_MARKER = ".droiddesk-xfce-mobile-v14"',
                      '    private const val PROFILE_MARKER = ".droiddesk-xfce-mobile-v16"', 1,
                  )
              else:
                  raise SystemExit('Could not locate the XFCE profile marker')
          profile = insert_once(
              profile,
              '            wallpaperFile.parentFile?.mkdirs()\n',
              '            File(homeDir, "Desktop").mkdirs()\n',
              'Desktop directory creation',
          )
          profile = replace_once(
              profile,
              '<property name="style" type="int" value="0"/>',
              '<property name="style" type="int" value="2"/>',
              'Show desktop icons',
          )
          profile_path.write_text(profile)

          # Distinguish the custom APK release 1.3.3.
          pubspec_path = Path('app/pubspec.yaml')
          pubspec = pubspec_path.read_text()
          if 'version: 1.3.3+8' not in pubspec:
              if 'version: 1.3.2+7' in pubspec:
                  pubspec = pubspec.replace('version: 1.3.2+7', 'version: 1.3.3+8', 1)
              elif 'version: 1.3.1+6' in pubspec:
                  pubspec = pubspec.replace('version: 1.3.1+6', 'version: 1.3.3+8', 1)
              else:
                  raise SystemExit('Could not locate the current APK version in pubspec.yaml')
          pubspec_path.write_text(pubspec)

          print('Source patch applied and verified.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install Android CMake and generate Gradle wrapper
        shell: bash
        run: |
          sdkmanager "cmake;3.22.1"
          FLUTTER_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          printf 'flutter.sdk=%s\n' "$FLUTTER_SDK" > app/android/local.properties
          cd app/android
          gradle wrapper --gradle-version 8.14 --distribution-type all

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Reuse the same debug signing key for future app updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: droiddesk-debug-signing-key-v1

      - name: Build ARM64 release APK
        working-directory: app
        shell: bash
        run: |
          flutter build apk --release --target-platform android-arm64
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidDesk-GIO-Fix-1.3.3-arm64
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit patched source files
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/LinuxRuntime.kt
          git add app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/XfceMobileProfile.kt
          git add app/pubspec.yaml
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Fix GIO launcher, persistent audio and desktop icons [skip ci]"
            git push
          fi
