name: Publish DroidDesk 1.3.8 Stable Download

on:
  workflow_dispatch:
  push:
    branches:
      - security/hardening-phase-1
    paths:
      - '.github/workflows/publish-droiddesk-1.3.8.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the already verified ARM64 APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DOWNLOAD_DIR="$RUNNER_TEMP/droiddesk-apk"
          mkdir -p "$DOWNLOAD_DIR"

          gh run download 42477307780 \
            --repo ah92j/DroidDesk-GIO-Fix \
            --name DroidDesk-1.3.8-arm64 \
            --dir "$DOWNLOAD_DIR"

          APK="$(find "$DOWNLOAD_DIR" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" DroidDesk-1.3.8-arm64.apk
          sha256sum DroidDesk-1.3.8-arm64.apk

      - name: Publish stable GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.3.8"
          APK="DroidDesk-1.3.8-arm64.apk"

          if gh release view "$TAG" --repo ah92j/DroidDesk-GIO-Fix >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" \
              --repo ah92j/DroidDesk-GIO-Fix --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo ah92j/DroidDesk-GIO-Fix \
              --target b415326f114303c0b6dac58b87afc66aae2475d5 \
              --title "DroidDesk 1.3.8" \
              --notes "ARM64 APK. The source build and permanent signing-certificate check passed in GitHub Actions."
          fi

          echo "https://github.com/ah92j/DroidDesk-GIO-Fix/releases/download/$TAG/$APK"
