name: Publish Kali Linux 1.4.26 APK and GitHub Release

on:
  workflow_run:
    workflows:
      - DroidDesk Permanent Release Build
    types:
      - completed
    branches:
      - security/hardening-phase-1

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == 'bded386958d5ddd088854f0ef7ae94243f50f4e9' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify the signed ARM64 APK artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          DOWNLOAD_DIR="$RUNNER_TEMP/kali-linux-apk"
          mkdir -p "$DOWNLOAD_DIR"
          gh run download "$SOURCE_RUN_ID" \
            --repo ah92j/DroidDesk-GIO-Fix \
            --name Kali-Linux-1.4.26-arm64 \
            --dir "$DOWNLOAD_DIR"

          APK="$(find "$DOWNLOAD_DIR" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          APK_SIZE="$(stat -c '%s' "$APK")"
          if [ "$APK_SIZE" -lt 30000000 ] || [ "$APK_SIZE" -gt 120000000 ]; then
            echo "Unexpected APK size: $APK_SIZE"
            exit 1
          fi
          cp "$APK" Kali-Linux-1.4.26-arm64.apk
          echo "APK SHA-256:"
          sha256sum Kali-Linux-1.4.26-arm64.apk

      - name: Publish stable direct APK URL while retaining previous releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE_NAME="Kali-Linux-1.4.26-arm64.apk"
          PUBLISH_DIR="$RUNNER_TEMP/apk-downloads"
          git clone --depth=1 --single-branch --branch apk-downloads \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PUBLISH_DIR"
          cp "$FILE_NAME" "$PUBLISH_DIR/$FILE_NAME"
          git -C "$PUBLISH_DIR" config user.name "github-actions[bot]"
          git -C "$PUBLISH_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PUBLISH_DIR" add "$FILE_NAME"
          git -C "$PUBLISH_DIR" commit -m "Publish Kali Linux 1.4.26 ARM64 APK"
          git -C "$PUBLISH_DIR" push origin HEAD:apk-downloads
          echo "Stable APK URL:"
          echo "https://raw.githubusercontent.com/ah92j/DroidDesk-GIO-Fix/apk-downloads/$FILE_NAME"

      - name: Publish APK as the latest GitHub Release for in-app updates
        # The APK was built from the exact workflow_run head SHA above. Target main for the
        # release tag because GitHub blocks GITHUB_TOKEN from creating refs at commits
        # that alter workflow files on a non-default branch.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.4.26+43"
          FILE_NAME="Kali-Linux-1.4.26-arm64.apk"
          TITLE="Kali Linux 1.4.26"
          NOTES="$(cat <<'RELEASE_NOTES'
          DroidDesk 1.4.26+43 for Android ARM64.

          - Adds a one-time migration that preserves the user's selected XFCE wallpaper, dock/panel preferences, desktop launchers and icon positions during upgrades.
          - Improves Firefox media compatibility for Android PRoot by avoiding the separate RDD media subprocess and selecting an available ARM64 FFmpeg codec package.
          - Extends Firefox diagnostics with shared-library resolution and active media preferences.
          - Refuses incompatible AMD64 DEB files, checks Kali ARM64 repositories for a native replacement, and directs users to Add applications when none exists.
          - Keeps the Add applications sections: Featured, Browse, Updates and Installed; fixes Firefox's installed-state alias.
          - Checks for a newer DroidDesk release on app launch and provides a direct APK link.

          Existing Kali rootfs data and installed packages are preserved.
          RELEASE_NOTES
          )"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE_NAME" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "$FILE_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isLatest,assets
