name: Publish Kali Linux 1.4.24 APK and GitHub Release

on:
  workflow_run:
    workflows:
      - DroidDesk Permanent Release Build
    types:
      - completed
    branches:
      - security/hardening-phase-1

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the signed ARM64 APK artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          DOWNLOAD_DIR="$RUNNER_TEMP/kali-linux-apk"
          mkdir -p "$DOWNLOAD_DIR"
          gh run download "$SOURCE_RUN_ID" \
            --repo ah92j/DroidDesk-GIO-Fix \
            --name Kali-Linux-1.4.24-arm64 \
            --dir "$DOWNLOAD_DIR"

          APK="$(find "$DOWNLOAD_DIR" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          APK_SIZE="$(stat -c '%s' "$APK")"
          if [ "$APK_SIZE" -lt 30000000 ] || [ "$APK_SIZE" -gt 120000000 ]; then
            echo "Unexpected APK size: $APK_SIZE"
            exit 1
          fi
          cp "$APK" Kali-Linux-1.4.24-arm64.apk
          echo "APK SHA-256:"
          sha256sum Kali-Linux-1.4.24-arm64.apk

      - name: Publish stable direct APK URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE_NAME="Kali-Linux-1.4.24-arm64.apk"
          PUBLISH_DIR="$RUNNER_TEMP/kali-linux-apk-download"
          mkdir -p "$PUBLISH_DIR"
          cp "$FILE_NAME" "$PUBLISH_DIR/$FILE_NAME"
          git -C "$PUBLISH_DIR" init -b apk-downloads
          git -C "$PUBLISH_DIR" config user.name "github-actions[bot]"
          git -C "$PUBLISH_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PUBLISH_DIR" add "$FILE_NAME"
          git -C "$PUBLISH_DIR" commit -m "Publish Kali Linux 1.4.24 ARM64 APK"
          git -C "$PUBLISH_DIR" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$PUBLISH_DIR" push --force origin HEAD:refs/heads/apk-downloads
          echo "Stable APK URL:"
          echo "https://raw.githubusercontent.com/ah92j/DroidDesk-GIO-Fix/apk-downloads/$FILE_NAME"

      - name: Publish APK as the latest GitHub Release for in-app updates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TAG="v1.4.24+41"
          FILE_NAME="Kali-Linux-1.4.24-arm64.apk"
          TITLE="Kali Linux 1.4.24"
          NOTES="DroidDesk 1.4.24+41 for Android ARM64.

          - Improves Firefox media codec setup for Kali ARM64 and PRoot.
          - Preserves existing XFCE wallpaper, panel, desktop icon positions and user launchers during upgrades.
          - Routes Add applications search, install and update actions into the Kali ARM64 rootfs.
          - Adds commonly used desktop and developer applications to Featured.
          - Notifies older app versions about this release on app launch and provides a direct APK link.

          Existing Kali files and installed packages are preserved."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE_NAME" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "$FILE_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isLatest,assets
