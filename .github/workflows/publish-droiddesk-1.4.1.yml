name: Publish DroidDesk 1.4.1 Direct APK

on:
  push:
    branches:
      - security/hardening-phase-1
    paths:
      - '.github/workflows/publish-droiddesk-1.4.1.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the verified 1.4.1 ARM64 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DOWNLOAD_DIR="$RUNNER_TEMP/droiddesk-apk"
          mkdir -p "$DOWNLOAD_DIR"

          gh run download 42494326384 \
            --repo ah92j/DroidDesk-GIO-Fix \
            --name DroidDesk-1.4.1-arm64 \
            --dir "$DOWNLOAD_DIR"

          APK="$(find "$DOWNLOAD_DIR" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" DroidDesk-1.4.1-arm64.apk
          sha256sum DroidDesk-1.4.1-arm64.apk

      - name: Publish stable direct download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE_NAME="DroidDesk-1.4.1-arm64.apk"
          PUBLISH_DIR="$RUNNER_TEMP/droiddesk-apk-download"
          mkdir -p "$PUBLISH_DIR"
          cp "$FILE_NAME" "$PUBLISH_DIR/$FILE_NAME"

          git -C "$PUBLISH_DIR" init -b apk-downloads
          git -C "$PUBLISH_DIR" config user.name "github-actions[bot]"
          git -C "$PUBLISH_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PUBLISH_DIR" add "$FILE_NAME"
          git -C "$PUBLISH_DIR" commit -m "Publish DroidDesk 1.4.1 ARM64 APK"
          git -C "$PUBLISH_DIR" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$PUBLISH_DIR" push --force origin HEAD:refs/heads/apk-downloads

          echo "Stable APK URL:"
          echo "https://raw.githubusercontent.com/ah92j/DroidDesk-GIO-Fix/apk-downloads/$FILE_NAME"
