name: Publish Verified Kali Candidate APK

on:
  push:
    branches:
      - security/hardening-phase-1
    paths:
      - '.github/workflows/publish-verified-kali-candidate.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the already verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: Kali-Linux-1.4.33-arm64
          repository: ah92j/DroidDesk-GIO-Fix
          run-id: 42870331318
          github-token: ${{ github.token }}
          path: candidate

      - name: Verify APK SHA256 against the successful build
        shell: bash
        run: |
          set -euo pipefail
          APK="candidate/Kali-Linux-1.4.33-arm64.apk"
          CHECKSUM="$APK.sha256"
          test -s "$APK"
          test -s "$CHECKSUM"
          EXPECTED="$(awk '{print $1}' "$CHECKSUM")"
          ACTUAL="$(sha256sum "$APK" | awk '{print $1}')"
          KNOWN_VERIFIED_SHA256="e9e745321488b8e81c832e4c5f51fe5210e79a70f4354cbd6cd011eea787e934"
          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" = "$KNOWN_VERIFIED_SHA256"
          echo "Verified ARM64 APK SHA256: $ACTUAL"
          echo "APK size: $(stat -c%s "$APK") bytes"

      - name: Replace stale release assets with the verified APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KNOWN_VERIFIED_SHA256="e9e745321488b8e81c832e4c5f51fe5210e79a70f4354cbd6cd011eea787e934"
          RELEASE_TAG="v1.4.33+50"
          APK="candidate/Kali-Linux-1.4.33-arm64.apk"
          CHECKSUM="$APK.sha256"
          TITLE="Kali Linux 1.4.33"
          NOTES="Kali Linux 1.4.33 ARM64 release. Adds the native Applications menu to the bottom XFCE panel, synchronizes shortcuts for previously installed applications, improves ARM64 Firefox media/codec selection, adds safer X11 reconnection and legacy drawing compatibility, and fixes in-app update discovery. Automated Flutter and Kotlin tests passed and the APK matches the permanent signing key. Firefox video playback and desktop-return stability still require verification on the target Android device. Existing Kali rootfs data is preserved."
          gh release upload "$RELEASE_TAG" "$APK" "$CHECKSUM" --clobber --repo "$GITHUB_REPOSITORY"
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
          test -n "$RELEASE_ID"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F prerelease=false \
            -F make_latest=true \
            -f name="$TITLE" \
            -f body="$NOTES" >/dev/null
          RELEASE_PRERELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.prerelease')"
          test "$RELEASE_PRERELEASE" = "false"
          LATEST_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          test "$LATEST_TAG" = "$RELEASE_TAG"
          ASSET_SIZE="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.assets[] | select(.name == "Kali-Linux-1.4.33-arm64.apk") | .size')"
          EXPECTED_SIZE="$(stat -c%s "$APK")"
          test "$ASSET_SIZE" = "$EXPECTED_SIZE"

          # Verify what a real Android client receives from GitHub's public CDN,
          # not only the file that was uploaded from the Actions artifact.
          ENCODED_TAG="${RELEASE_TAG//+/%2B}"
          PUBLIC_APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$ENCODED_TAG/Kali-Linux-1.4.33-arm64.apk"
          curl --fail --location --retry 3 --retry-all-errors \
            "$PUBLIC_APK_URL" --output candidate/published.apk
          PUBLIC_SHA256="$(sha256sum candidate/published.apk | awk '{print $1}')"
          test "$PUBLIC_SHA256" = "$KNOWN_VERIFIED_SHA256"
          echo "Public release download SHA256 matches the signed build: $PUBLIC_SHA256"

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets
