name: Publish Kali Linux 1.4.30 APK and GitHub Release

on:
  workflow_run:
    workflows:
      - DroidDesk Permanent Release Build
    types:
      - completed
    branches:
      - security/hardening-phase-1

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == 'cc57390561407d68042486dd70ee2f37ab111c18' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify the signed ARM64 APK artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          DOWNLOAD_DIR="$RUNNER_TEMP/kali-linux-apk"
          mkdir -p "$DOWNLOAD_DIR"
          gh run download "$SOURCE_RUN_ID" \
            --repo ah92j/DroidDesk-GIO-Fix \
            --name Kali-Linux-1.4.29-arm64 \
            --dir "$DOWNLOAD_DIR"

          APK="$(find "$DOWNLOAD_DIR" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          APK_SIZE="$(stat -c '%s' "$APK")"
          if [ "$APK_SIZE" -lt 30000000 ] || [ "$APK_SIZE" -gt 120000000 ]; then
            echo "Unexpected APK size: $APK_SIZE"
            exit 1
          fi
          cp "$APK" Kali-Linux-1.4.30-arm64.apk
          echo "APK SHA-256:"
          sha256sum Kali-Linux-1.4.30-arm64.apk

      - name: Publish stable direct APK URL while retaining previous releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE_NAME="Kali-Linux-1.4.30-arm64.apk"
          PUBLISH_DIR="$RUNNER_TEMP/apk-downloads"
          git clone --depth=1 --single-branch --branch apk-downloads \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PUBLISH_DIR"
          cp "$FILE_NAME" "$PUBLISH_DIR/$FILE_NAME"
          git -C "$PUBLISH_DIR" config user.name "github-actions[bot]"
          git -C "$PUBLISH_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PUBLISH_DIR" add "$FILE_NAME"
          git -C "$PUBLISH_DIR" commit -m "Publish Kali Linux 1.4.29 ARM64 APK"
          git -C "$PUBLISH_DIR" push origin HEAD:apk-downloads
          echo "Stable APK URL:"
          echo "https://raw.githubusercontent.com/ah92j/DroidDesk-GIO-Fix/apk-downloads/$FILE_NAME"

      - name: Publish APK as the latest GitHub Release for in-app updates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.4.30+47"
          FILE_NAME="Kali-Linux-1.4.30-arm64.apk"
          TITLE="Kali Linux 1.4.30"
          NOTES="$(cat <<'RELEASE_NOTES'
          DroidDesk 1.4.30+47 for Android ARM64.

          - Repairs Kali App Store command construction so the install/upgrade action is supplied by Kotlin and is not interpreted as an unset Bash variable.
          - Adds official Kali HTTPS mirror failover for package index refresh and installation: the configured Kali mirror is tried first, followed by kali.download and archive.kali.org. The source is changed only in DroidDesk's dedicated Kali source file, and the catalog must contain an ARM64 package index.
          - Retries App Store package operations after refreshing the ARM64 index from the working official mirror, while preserving dpkg repair and no-recommends installation behavior.
          - Adds /usr/lib/firefox-esr to Firefox's runtime library path so its RDD/media child processes can resolve bundled Firefox libraries.
          - Prefers Firefox's matching libavcodec-extra ABI package over the basic libavcodec package when the ARM64 package is available.
          - Applies the Firefox library-path migration to the existing Kali rootfs without resetting Kali, user files, or XFCE preferences.

          GitHub Actions verifies shell syntax, Kali migration self-tests, Kotlin tests, ARM64 APK build, and the permanent release signing certificate. Actual YouTube video/audio playback and App Store installs still require confirmation on the target phone; build success alone does not prove runtime playback.
          RELEASE_NOTES          )"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE_NAME" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "$FILE_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,assets
