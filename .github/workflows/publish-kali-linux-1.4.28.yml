name: Publish Kali Linux 1.4.28 APK and GitHub Release

on:
  workflow_run:
    workflows:
      - DroidDesk Permanent Release Build
    types:
      - completed
    branches:
      - security/hardening-phase-1

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == 'f77b651e1f2e36c272f24f1b75fdad9d6606f40c' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify the signed ARM64 APK artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          DOWNLOAD_DIR="$RUNNER_TEMP/kali-linux-apk"
          mkdir -p "$DOWNLOAD_DIR"
          gh run download "$SOURCE_RUN_ID" \
            --repo ah92j/DroidDesk-GIO-Fix \
            --name Kali-Linux-1.4.28-arm64 \
            --dir "$DOWNLOAD_DIR"

          APK="$(find "$DOWNLOAD_DIR" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          APK_SIZE="$(stat -c '%s' "$APK")"
          if [ "$APK_SIZE" -lt 30000000 ] || [ "$APK_SIZE" -gt 120000000 ]; then
            echo "Unexpected APK size: $APK_SIZE"
            exit 1
          fi
          cp "$APK" Kali-Linux-1.4.28-arm64.apk
          echo "APK SHA-256:"
          sha256sum Kali-Linux-1.4.28-arm64.apk

      - name: Publish stable direct APK URL while retaining previous releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE_NAME="Kali-Linux-1.4.28-arm64.apk"
          PUBLISH_DIR="$RUNNER_TEMP/apk-downloads"
          git clone --depth=1 --single-branch --branch apk-downloads \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PUBLISH_DIR"
          cp "$FILE_NAME" "$PUBLISH_DIR/$FILE_NAME"
          git -C "$PUBLISH_DIR" config user.name "github-actions[bot]"
          git -C "$PUBLISH_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PUBLISH_DIR" add "$FILE_NAME"
          git -C "$PUBLISH_DIR" commit -m "Publish Kali Linux 1.4.28 ARM64 APK"
          git -C "$PUBLISH_DIR" push origin HEAD:apk-downloads
          echo "Stable APK URL:"
          echo "https://raw.githubusercontent.com/ah92j/DroidDesk-GIO-Fix/apk-downloads/$FILE_NAME"

      - name: Publish APK as the latest GitHub Release for in-app updates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.4.28+45"
          FILE_NAME="Kali-Linux-1.4.28-arm64.apk"
          TITLE="Kali Linux 1.4.28"
          NOTES="$(cat <<'RELEASE_NOTES'
          DroidDesk 1.4.28+45 for Android ARM64.

          - Repairs interrupted dpkg configuration before each App Store installation and checks dpkg --audit before and after transactions.
          - Installs applications without optional Recommends dependency trees, keeps downloaded APT archives, and records periodic dpkg activity heartbeats.
          - Reports actual APT package stages instead of displaying a fabricated fixed 55% progress value.
          - Prevents service-start scripts from waiting for system services unavailable inside rootless PRoot.
          - Replaces the large kali-wallpapers-all dependency with the focused kali-wallpapers-2026 package set.
          - Avoids forcibly reinstalling Firefox ESR and installs its matching ARM64 FFmpeg codec package when available.
          - Checks that Firefox can reach DroidDesk's Android AudioTrack-backed PulseAudio sink and records Firefox launch, codec and audio diagnostics.
          - Runs the desktop migration while preserving the existing Kali rootfs, installed applications and XFCE user preferences.

          On-device YouTube picture and audio playback still require confirmation on the target Android device.
          RELEASE_NOTES
          )"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE_NAME" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "$FILE_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,assets
